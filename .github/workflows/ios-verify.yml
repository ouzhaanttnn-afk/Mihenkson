name: iOS native verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulator-build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test && npm run release:check && npm run build && npx cap sync ios
      - name: Compile native StoreKit bridge without uploading
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
