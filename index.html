    <!--
      TAM EKRAN KURULUM.

      Mobil Safari'nin adres çubuğu + alt araç çubuğu ekranın yaklaşık
      dörtte birini yiyor: 390x844'lük bir telefonda uygulamaya 633 px
      kalıyor ve İşlem Masası 449 px'ten 276 px'e düşüyor. Uygulama
      `100dvh` kullandığı için hiçbir şey çubukların altında KAYBOLMUYOR,
      ama olmayan alanı da yaratamaz.

      "Ana Ekrana Ekle" ile açıldığında çubuklar hiç çizilmez ve o alan
      geri gelir. iOS bunun için apple-mobile-web-app-capable + apple-touch-icon,
      Android/Chrome ise manifest ister; ikisi de olmadan kurulum yarım
      kalıyordu (iOS ikon yerine sayfanın ekran görüntüsünü kullanıyordu).
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MIHENKAYNAK" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./assets/brand/icon-180.png" />
    <link rel="icon" href="./assets/brand/icon-192.png" />
    <title>MIHENKAYNAK</title>
  </head>
